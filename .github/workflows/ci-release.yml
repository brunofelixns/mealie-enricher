name: Pruebas y publicación
run-name: ${{ inputs.release_tag && format('Publicar {0}', inputs.release_tag) || format('CI {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag publicado que se debe validar y publicar en GHCR (vacío: solo CI)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event_name }}-${{ inputs.release_tag && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  UV_VERSION: '0.11.28'
  PYTHON_VERSION: '3.14.6'
  PYTHONUTF8: '1'

jobs:
  verify:
    name: Suite completa y calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: enricher-ci-only
          POSTGRES_DB: enricher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enricher_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    permissions:
      contents: read
      pull-requests: read # Validate the merged release PR before executing its tag.
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version || steps.identity.outputs.version }}
    env:
      RUN_DOCKER_SMOKE: '1'
      RUN_REAL_BEDCA: '1'
      RUN_BEDCA_IMAGE_REAL: '1'
      RUN_PRICING_MEALIE_E2E: '1'
      CATALOG_TEST_IMAGE: mealie-enricher:ci
      BEDCA_BUNDLED_TEST_IMAGE: mealie-enricher:ci-bedca
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:enricher-ci-only@127.0.0.1:5432/enricher_test
    steps:
      - name: Obtener el validador de la revisión de confianza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolver y comprobar la procedencia antes de ejecutar el tag
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!tag) {
              core.setOutput('sha', context.sha);
              return;
            }
            if (context.ref !== 'refs/heads/main') throw new Error('Publicar únicamente desde el workflow de main');
            const {execFileSync} = require('node:child_process');
            const {validateRelease} = require(`${process.env.GITHUB_WORKSPACE}/ci/release-please/provenance.cjs`);
            const result = JSON.parse(execFileSync('python', ['ci/release_policy.py', 'resolve', '--tag', tag], {encoding: 'utf8'}));
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: result.sha, per_page: 100
            });
            validateRelease(release, pulls, result.sha, `${context.repo.owner}/${context.repo.repo}`, process.env.RELEASE_APP_SLUG);
            core.setOutput('sha', result.sha);
            core.setOutput('version', result.version);
      - name: Conservar el control de cobertura de la revisión de confianza
        run: |
          mkdir -p "$RUNNER_TEMP/enricher-ci"
          cp ci/quality.py "$RUNNER_TEMP/enricher-ci/quality.py"
      - name: Obtener la revisión exacta que se comprobará
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar metadatos de la PR o rama
        if: ${{ !inputs.release_tag }}
        id: identity
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python ci/release_policy.py metadata --github-output "$GITHUB_OUTPUT"
          if [ "$PR_BRANCH" = 'release-please--branches--main' ]; then
            python ci/release_policy.py proposal --base "$BASE_SHA"
          fi
      - name: Probar SDK oficial de Release Please
        run: |
          npm ci --prefix ci/release-please --ignore-scripts --no-audit --no-fund
          npm test --prefix ci/release-please
      - name: Preparar uv y Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false # No shared cache writes after a release checkout.
      - name: Instalar dependencias bloqueadas
        run: uv sync --locked
      - name: Estilo y tipos
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src/mealie_enricher
      - name: Preparar BEDCA con checksums
        uses: ./.github/actions/prepare-bedca # zizmor: ignore[self-repository] -- execute the validated checkout, including release tags
      - name: Construir las imágenes de prueba
        run: |
          docker buildx use default
          if grep -q '^FROM app-runtime AS bedca-builder$' Dockerfile; then
            # One complete image; local aliases keep historical test fixtures compatible.
            docker buildx build --load --build-context bedca_source=./data/bedca \
              --tag mealie-enricher:ci --tag mealie-enricher:ci-bedca --tag mealie-enricher:local .
          else
            # Historical release checkouts keep their original two-image test contract.
            docker build --tag mealie-enricher:ci --tag mealie-enricher:local .
            docker buildx build --load --network none \
              --build-context bedca_source=./data/bedca \
              --build-arg BASE_IMAGE=mealie-enricher:ci \
              --build-arg BEDCA_DATASET_VERSION=bedca-export-2026-08-19 \
              --file docker/Dockerfile.bedca --tag mealie-enricher:ci-bedca .
          fi
      - name: Descargar imágenes del Mealie aislado
        run: docker compose --profile test pull mealie mock-off
      - name: Ejecutar toda la suite, incluido Mealie real
        run: |
          mkdir -p .cache
          uv run --frozen pytest -q --cov=mealie_enricher --cov-report=xml --cov-fail-under=95 --junitxml=.cache/ci-results.xml
          python ci/check_test_report.py .cache/ci-results.xml
          python "$RUNNER_TEMP/enricher-ci/quality.py" coverage coverage.xml --junit .cache/ci-results.xml
      - name: Conservar informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/ci-results.xml
            coverage.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publicar release en GHCR
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main' && github.repository == 'brunofelixns/mealie-enricher'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: ghcr-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # Upload durable release evidence and update its receipt.
      packages: write # Publish verified image digests and OCI attestations.
      id-token: write # Obtain short-lived Sigstore signing identity.
      attestations: write # Store the signed evidence in GitHub.
    env:
      IMAGE_REPOSITORY: ghcr.io/brunofelixns/mealie-enricher
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Obtener la revisión validada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirmar tag y metadatos
        run: python ci/release_policy.py verify --tag "$RELEASE_TAG"
      - name: Obtener herramientas de seguridad de la revisión de confianza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .cache/trusted-ci
          persist-credentials: false
      - name: Preparar BEDCA con checksums
        uses: ./.github/actions/prepare-bedca # zizmor: ignore[self-repository] -- execute the validated release checkout
      - name: Preparar emulación ARM
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Preparar Buildx multiplataforma
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Autenticar en GHCR con el token del workflow
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y verificar candidatos amd64 y arm64
        run: |
          python ci/images.py build --repository "$IMAGE_REPOSITORY" \
            --version "$RELEASE_VERSION" --revision "$RELEASE_SHA" \
            --output .cache/release-images.json
      - name: Escanear los digests de plataforma y generar SBOM y procedencia
        id: security
        run: python .cache/trusted-ci/ci/security.py --manifest .cache/release-images.json --output .cache/release-security
      - name: Acreditar SBOM de la imagen amd64
        if: steps.security.outputs.image_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA
        with:
          name: image-amd64
          digest: ${{ steps.security.outputs.image_amd64_digest }}
          sbom-path: .cache/release-security/image-amd64.cdx.json
      - name: Acreditar SBOM de la imagen arm64
        if: steps.security.outputs.image_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA
        with:
          name: image-arm64
          digest: ${{ steps.security.outputs.image_arm64_digest }}
          sbom-path: .cache/release-security/image-arm64.cdx.json
      - name: Acreditar procedencia de la imagen completa
        if: steps.security.outputs.image_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA
        with:
          name: image-provenance
          digest: ${{ steps.security.outputs.image_digest }}
          predicate-path: .cache/release-security/image.provenance.json
      - name: Acreditar SBOM base amd64
        if: steps.security.outputs.base_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: base-amd64
          digest: ${{ steps.security.outputs.base_amd64_digest }}
          sbom-path: .cache/release-security/base-amd64.cdx.json
      - name: Acreditar SBOM base arm64
        if: steps.security.outputs.base_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: base-arm64
          digest: ${{ steps.security.outputs.base_arm64_digest }}
          sbom-path: .cache/release-security/base-arm64.cdx.json
      - name: Acreditar SBOM BEDCA amd64
        if: steps.security.outputs.bedca_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: bedca-amd64
          digest: ${{ steps.security.outputs.bedca_amd64_digest }}
          sbom-path: .cache/release-security/bedca-amd64.cdx.json
      - name: Acreditar SBOM BEDCA arm64
        if: steps.security.outputs.bedca_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: bedca-arm64
          digest: ${{ steps.security.outputs.bedca_arm64_digest }}
          sbom-path: .cache/release-security/bedca-arm64.cdx.json
      - name: Acreditar procedencia de la promoción base
        if: steps.security.outputs.base_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: base-provenance
          digest: ${{ steps.security.outputs.base_digest }}
          predicate-path: .cache/release-security/base.provenance.json
      - name: Acreditar procedencia de la promoción BEDCA
        if: steps.security.outputs.bedca_digest != ''
        uses: ./.cache/trusted-ci/.github/actions/attest-image # zizmor: ignore[self-repository] -- trusted workflow SHA, independent of historical release checkout
        with:
          name: bedca-provenance
          digest: ${{ steps.security.outputs.bedca_digest }}
          predicate-path: .cache/release-security/bedca.provenance.json
      - name: Guardar evidencias duraderas antes de promocionar
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
            const prefix = `evidence-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-`;
            const existing = new Set((await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id})).map(a => a.name));
            const files = ['.cache/release-images.json', ...fs.readdirSync('.cache/release-security').map(name => `.cache/release-security/${name}`)];
            for (const file of files) {
              const name = prefix + path.basename(file);
              if (existing.has(name)) continue;
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(file), headers: {'content-type': 'application/json'}
              });
            }
      - name: Consultar releases estables antes de promocionar
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            fs.mkdirSync('.cache', {recursive: true});
            fs.writeFileSync('.cache/releases.json', JSON.stringify(releases));
      - name: Evitar retroceder los aliases
        id: aliases
        run: python ci/release_policy.py aliases --version "$RELEASE_VERSION" --releases .cache/releases.json --github-output "$GITHUB_OUTPUT"
      - name: Promocionar la versión y los aliases vigentes
        env:
          PUBLISH_ALIASES: ${{ steps.aliases.outputs.publish_aliases }}
        run: |
          if [ "$PUBLISH_ALIASES" = 'true' ]; then
            python ci/images.py promote --manifest .cache/release-images.json
          else
            python ci/images.py promote --manifest .cache/release-images.json --version-only
          fi
      - name: Añadir evidencias de las imágenes a la release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISH_ALIASES: ${{ steps.aliases.outputs.publish_aliases }}
        with:
          script: |
            const fs = require('fs');
            const images = JSON.parse(fs.readFileSync('.cache/release-images.json', 'utf8'));
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
            const marker = '<!-- ghcr-evidence -->';
            const notes = (release.body || '').split(marker)[0].trimEnd();
            const imageNotes = images.image_digest
              ? [`Imagen completa (BEDCA incluido): ${images.repository}:${images.version}`, `Digest: ${images.image_digest}`]
              : [`Base: ${images.repository}:${images.version}`, `Digest: ${images.base_digest}`,
                 `BEDCA: ${images.repository}:${images.version}-bedca`, `Digest: ${images.bedca_digest}`];
            const evidence = [
              marker, '', '### Imágenes verificadas', '',
              ...imageNotes,
              `Revisión: ${images.revision}`, '',
              'Suite completa correcta. Plataformas: linux/amd64 y linux/arm64; ARM mediante QEMU.',
              'Escaneo Trivy de cada manifiesto de plataforma; SBOM CycloneDX y procedencia de promoción firmados con GitHub OIDC y publicados en GHCR.',
              'Informes y bundles verificables conservados como assets de esta release.',
              'BEDCA conserva DuckDB y los CSV originales, bajo sus condiciones de uso no comercial:',
              'https://www.bedca.net/bdpub/UsoBD.pdf'
            ].join('\n');
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, body: `${notes}\n\n${evidence}`,
              make_latest: process.env.PUBLISH_ALIASES === 'true' ? 'true' : 'false'
            });
      - name: Conservar manifiesto de publicación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publicacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/release-images.json
            .cache/release-security/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
