name: PR de publicación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Mantener PR de versión
    if: github.repository == 'brunofelixns/mealie-enricher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # Inspect release provenance; the App token writes PRs.
      actions: write # Dispatch the publication workflow after creating a release.
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar que la revisión sigue vigente
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const head = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            core.setOutput('current', String(head.data.object.sha === context.sha));
      - name: Instalar SDK oficial bloqueado
        if: steps.current.outputs.current == 'true'
        run: npm ci --prefix ci/release-please --ignore-scripts --no-audit --no-fund
      - name: Crear token temporal de la App para este repositorio
        if: steps.current.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] -- main-only job, dedicated single-repository App, temporary token revoked at job end
          owner: ${{ github.repository_owner }}
          repositories: mealie-enricher
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Comprobar la identidad de la App
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTUAL_APP: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_APP: ${{ vars.RELEASE_APP_SLUG }}
        with:
          script: |
            if (!process.env.EXPECTED_APP || process.env.ACTUAL_APP !== process.env.EXPECTED_APP) {
              throw new Error('La App autenticada no coincide con RELEASE_APP_SLUG');
            }
      - name: Mantener PR y solicitar publicaciones
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        with:
          script: |
            const {run} = require(`${process.env.GITHUB_WORKSPACE}/ci/release-please/run.cjs`);
            await run({github, context, core});
