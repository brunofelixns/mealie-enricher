name: PR de publicación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Mantener PR de versión
    if: github.repository == 'brunofelixns/mealie-enricher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Obtener código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar que la revisión sigue vigente
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const head = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            core.setOutput('current', String(head.data.object.sha === context.sha));
      - name: Instalar SDK oficial bloqueado
        if: steps.current.outputs.current == 'true'
        run: npm ci --prefix ci/release-please --ignore-scripts --no-audit --no-fund
      - name: Mantener PR y solicitar publicaciones
        if: steps.current.outputs.current == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const {run} = require(`${process.env.GITHUB_WORKSPACE}/ci/release-please/run.cjs`);
            await run({github, context, core});
