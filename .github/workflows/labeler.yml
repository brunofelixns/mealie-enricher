name: Etiquetar PR por carpetas

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número de la PR existente que se debe etiquetar
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  label:
    name: Etiquetas por carpetas
    if: github.repository == 'brunofelixns/mealie-enricher'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # Add predefined labels; no checkout or execution of PR code.
    steps:
      - name: Clasificar archivos con la configuración de confianza
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          sync-labels: false
