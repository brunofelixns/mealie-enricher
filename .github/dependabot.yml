version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/attest-image, /.github/actions/prepare-bedca]
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /ci/release-please
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories: [/, /docker, /ci/trivy]
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directories: [/, /docker]
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    cooldown:
      default-days: 7
