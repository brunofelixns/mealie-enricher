x-calorie-env: &calorie-env
  MEALIE_URL: ${MEALIE_URL:-http://mealie:9000}
  MEALIE_TIMEOUT_MS: ${MEALIE_TIMEOUT_MS:-30000}
  OFF_LANGUAGE: ${OFF_LANGUAGE:-en}
  OFF_BASE_URL: ${OFF_BASE_URL:-https://world.openfoodfacts.org}
  OFF_SEARCH_BASE_URL: ${OFF_SEARCH_BASE_URL:-https://search.openfoodfacts.org}
  OFF_USER_AGENT: ${OFF_USER_AGENT:-MealieCalorieEstimator/1.0 (calories@example.com)}
  OFF_SEARCH_RATE_LIMIT: ${OFF_SEARCH_RATE_LIMIT:-10}
  OFF_PRODUCT_RATE_LIMIT: ${OFF_PRODUCT_RATE_LIMIT:-15}
  OFF_CACHE_TTL: ${OFF_CACHE_TTL:-86400}
  OFF_MAX_RETRIES: ${OFF_MAX_RETRIES:-3}
  OFF_RETRY_BACKOFF_MS: ${OFF_RETRY_BACKOFF_MS:-500}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-/chat/completions}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_RATE_LIMIT: ${LLM_RATE_LIMIT:-30}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  # Empty values select the application's model-specific token budgets.
  LLM_MAX_TOKENS_GRAMS: ${LLM_MAX_TOKENS_GRAMS:-}
  LLM_MAX_TOKENS_NUTRIENTS: ${LLM_MAX_TOKENS_NUTRIENTS:-}
  ESTIMATE_STRATEGY: ${ESTIMATE_STRATEGY:-all}
  ESTIMATE_TAG: ${ESTIMATE_TAG:-estimate}
  EVENT_DEBOUNCE_MS: ${EVENT_DEBOUNCE_MS:-2000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CACHE_DB_PATH: /app/data/cache.db
  HISTORY_MAX_ENTRIES: ${HISTORY_MAX_ENTRIES:-200}
  MEALIE_RECIPE_URL_TEMPLATE: ${MEALIE_RECIPE_URL_TEMPLATE:-}
  DEV_SEED_HISTORY: ${DEV_SEED_HISTORY:-false}
  CATALOG_ENABLED: ${CATALOG_ENABLED:-true}
  CATALOG_DB_PATH: ${CATALOG_DB_PATH:-/opt/bedca/catalogos.duckdb}
  DECISIONS_ENABLED: ${DECISIONS_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DECISIONS_API_KEY: ${DECISIONS_API_KEY:-}
  DECISIONS_MODEL: ${DECISIONS_MODEL:-gpt-6-luna}
  DECISIONS_MIN_CONFIDENCE: ${DECISIONS_MIN_CONFIDENCE:-0.9}
  DECISIONS_TIMEOUT_SECONDS: ${DECISIONS_TIMEOUT_SECONDS:-20}
  DECISIONS_MAX_CONCURRENCY: ${DECISIONS_MAX_CONCURRENCY:-2}

services:
  calorie-estimator:
    image: mealie-enricher:local
    build:
      context: .
      additional_contexts:
        bedca_source: ${BEDCA_INPUT_DIR:-./data/bedca}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *calorie-env
      PORT: ${PORT:-8000}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - estimator-cache:/app/data
      - estimator-catalogs:/app/catalogs:ro
    restart: unless-stopped

  catalog-import:
    image: mealie-enricher:local
    build:
      context: .
      additional_contexts:
        bedca_source: ${BEDCA_INPUT_DIR:-./data/bedca}
    profiles: [catalog]
    entrypoint: ["python", "-m", "mealie_enricher.catalog.cli"]
    command:
      - import-bedca
      - --input-dir
      - /input
      - --output
      - /app/catalogs/catalogos.duckdb
      - --dataset-version
      - ${BEDCA_DATASET_VERSION:-2026-08-19}
    volumes:
      - estimator-catalogs:/app/catalogs
      - ${BEDCA_INPUT_DIR:-./data/bedca}:/input:ro

  calorie-estimator-test:
    image: mealie-enricher:local
    build:
      context: .
      additional_contexts:
        bedca_source: ${BEDCA_INPUT_DIR:-./data/bedca}
    env_file:
      - path: ${TEST_ENV_FILE:-.compose-test.env}
        required: false
    environment:
      <<: *calorie-env
      MEALIE_URL: http://mealie:9000
      OFF_SEARCH_BASE_URL: http://mock-off:3000
      PORT: "8000"
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:${TEST_ESTIMATOR_PORT:-8002}:8000"
    volumes:
      - estimator-test-cache:/app/data
      - estimator-catalogs:/app/catalogs:ro
    depends_on:
      mealie:
        condition: service_healthy
      mock-off:
        condition: service_started
    profiles: [test]

  mock-off:
    image: python:3.14.9-slim
    command: ["python", "/app/mock_off_server.py"]
    volumes:
      - ./tests/support/mock_off_server.py:/app/mock_off_server.py:ro
    profiles: [test]

  mealie:
    image: ${TEST_MEALIE_IMAGE:-ghcr.io/mealie-recipes/mealie:v3.30.0}
    ports:
      - "127.0.0.1:${TEST_MEALIE_PORT:-9000}:9000"
    volumes:
      - mealie-test-data:/app/data
    environment:
      ALLOW_SIGNUP: "true"
      DB_ENGINE: sqlite
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/app/about"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    profiles: [test]

volumes:
  estimator-catalogs:
  estimator-cache:
  estimator-test-cache:
  mealie-test-data:
